apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/kdudka/konflux-test-multicluster-global-hub?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch
      == "main"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: konflux-test-multicluster-global-hub
    appstudio.openshift.io/component: konflux-test-multicluster-global-hub
    pipelines.appstudio.openshift.io/type: build
  name: konflux-test-multicluster-global-hub-on-pull-request
  namespace: rhn-support-kdudka-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/rhn-support-kdudka-tenant/konflux-test-multicluster-global-hub/konflux-test-multicluster-global-hub:on-pr-{{revision}}
  - name: image-expires-after
    value: 5d
  - name: dockerfile
    value: operator/Dockerfile
  pipelineSpec:
    finally:
    - name: show-sbom
      params:
      - name: IMAGE_URL
        value: $(tasks.build-container.results.IMAGE_URL)
      taskRef:
        params:
        - name: name
          value: show-sbom
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-show-sbom:0.1@sha256:9bfc6b99ef038800fe131d7b45ff3cd4da3a415dd536f7c657b3527b01c4a13b
        - name: kind
          value: task
        resolver: bundles
    - name: show-summary
      params:
      - name: pipelinerun-name
        value: $(context.pipelineRun.name)
      - name: git-url
        value: $(tasks.clone-repository.results.url)?rev=$(tasks.clone-repository.results.commit)
      - name: image-url
        value: $(params.output-image)
      - name: build-task-status
        value: $(tasks.build-container.status)
      taskRef:
        params:
        - name: name
          value: summary
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-summary:0.2@sha256:d97c04ab42f277b1103eb6f3a053b247849f4f5b3237ea302a8ecada3b24e15b
        - name: kind
          value: task
        resolver: bundles
      workspaces:
      - name: workspace
        workspace: workspace
    params:
    - description: Source Repository URL
      name: git-url
      type: string
    - default: ""
      description: Revision of the Source Repository
      name: revision
      type: string
    - description: Fully Qualified Output Image
      name: output-image
      type: string
    - default: .
      description: Path to the source code of an application's component from where
        to build image.
      name: path-context
      type: string
    - default: Dockerfile
      description: Path to the Dockerfile inside the context specified by parameter
        path-context
      name: dockerfile
      type: string
    - default: "false"
      description: Force rebuild image
      name: rebuild
      type: string
    - default: "false"
      description: Skip checks against built image
      name: skip-checks
      type: string
    - default: "false"
      description: Execute the build with network isolation
      name: hermetic
      type: string
    - default: ""
      description: Build dependencies to be prefetched by Cachi2
      name: prefetch-input
      type: string
    - default: "false"
      description: Java build
      name: java
      type: string
    - default: ""
      description: Image tag expiration time, time values could be something like
        1h, 2d, 3w for hours, days, and weeks, respectively.
      name: image-expires-after
    - default: "false"
      description: Build a source image.
      name: build-source-image
      type: string
    - default: []
      description: Array of --build-arg values ("arg=value" strings) for buildah
      name: build-args
      type: array
    - default: ""
      description: Path to a file with build arguments for buildah, see https://www.mankier.com/1/buildah-build#--build-arg-file
      name: build-args-file
      type: string
    results:
    - description: ""
      name: IMAGE_URL
      value: $(tasks.build-container.results.IMAGE_URL)
    - description: ""
      name: IMAGE_DIGEST
      value: $(tasks.build-container.results.IMAGE_DIGEST)
    - description: ""
      name: CHAINS-GIT_URL
      value: $(tasks.clone-repository.results.url)
    - description: ""
      name: CHAINS-GIT_COMMIT
      value: $(tasks.clone-repository.results.commit)
    - description: ""
      name: JAVA_COMMUNITY_DEPENDENCIES
      value: $(tasks.build-container.results.JAVA_COMMUNITY_DEPENDENCIES)
    tasks:
    - name: init
      params:
      - name: image-url
        value: $(params.output-image)
      - name: rebuild
        value: $(params.rebuild)
      - name: skip-checks
        value: $(params.skip-checks)
      taskRef:
        params:
        - name: name
          value: init
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-init:0.2@sha256:092c113b614f6551113f17605ae9cb7e822aa704d07f0e37ed209da23ce392cc
        - name: kind
          value: task
        resolver: bundles
    - name: clone-repository
      params:
      - name: url
        value: $(params.git-url)
      - name: revision
        value: $(params.revision)
      runAfter:
      - init
      taskRef:
        params:
        - name: name
          value: git-clone
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-git-clone:0.1@sha256:0bb1be8363557e8e07ec34a3c5daaaaa23c9d533f0bb12f00dc604d00de50814
        - name: kind
          value: task
        resolver: bundles
      when:
      - input: $(tasks.init.results.build)
        operator: in
        values:
        - "true"
      workspaces:
      - name: output
        workspace: workspace
      - name: basic-auth
        workspace: git-auth
    - name: prefetch-dependencies
      params:
      - name: input
        value: $(params.prefetch-input)
      runAfter:
      - clone-repository
      taskRef:
        params:
        - name: name
          value: prefetch-dependencies
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-prefetch-dependencies:0.1@sha256:2bbeb1fa9eaa1b02c56524ff5ccd137a28d59626b7eedc1d3e714b69e4e17ac7
        - name: kind
          value: task
        resolver: bundles
      when:
      - input: $(params.prefetch-input)
        operator: notin
        values:
        - ""
      workspaces:
      - name: source
        workspace: workspace
      - name: git-basic-auth
        workspace: git-auth
      - name: netrc
        workspace: netrc
    - name: build-container
      params:
      - name: IMAGE
        value: $(params.output-image)
      - name: DOCKERFILE
        value: $(params.dockerfile)
      - name: CONTEXT
        value: $(params.path-context)
      - name: HERMETIC
        value: $(params.hermetic)
      - name: PREFETCH_INPUT
        value: $(params.prefetch-input)
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.image-expires-after)
      - name: COMMIT_SHA
        value: $(tasks.clone-repository.results.commit)
      - name: BUILD_ARGS
        value:
        - $(params.build-args[*])
      - name: BUILD_ARGS_FILE
        value: $(params.build-args-file)
      runAfter:
      - prefetch-dependencies
      taskRef:
        params:
        - name: name
          value: buildah
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-buildah:0.2@sha256:67963bcd91b23ee90f2c4ecb8b7f523c457f6c350df17bc192480dbd085a241d
        - name: kind
          value: task
        resolver: bundles
      when:
      - input: $(tasks.init.results.build)
        operator: in
        values:
        - "true"
      workspaces:
      - name: source
        workspace: workspace
    - name: sast-coverity-check
      params:
      - name: IMAGE
        value: $(params.output-image)
      - name: DOCKERFILE
        value: $(params.dockerfile)
      - name: CONTEXT
        value: $(params.path-context)
      - name: HERMETIC
        value: $(params.hermetic)
      - name: PREFETCH_INPUT
        value: $(params.prefetch-input)
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.image-expires-after)
      - name: COMMIT_SHA
        value: $(tasks.clone-repository.results.commit)
      - name: BUILD_ARGS
        value:
        - $(params.build-args[*])
      - name: BUILD_ARGS_FILE
        value: $(params.build-args-file)
      - name: IMAGE_URL
        value: $(tasks.build-container.results.IMAGE_URL)
      - name: IMP_FINDINGS_ONLY
        value: "false"
      - name: COV_ANALYZE_ARGS
        value: "--disable-default -en ANGULAR_EXPRESSION_INJECTION -en ARRAY_VS_SINGLETON -en ATOMICITY -en AUDIT.SPECULATIVE_EXECUTION_DATA_LEAK -en BAD_ALLOC_ARITHMETIC -en BAD_ALLOC_STRLEN -en BAD_CERT_VERIFICATION -en BAD_CHECK_OF_WAIT_COND -en BAD_FREE -en BAD_LOCK_OBJECT -en BUFFER_SIZE -en COM.ADDROF_LEAK -en COM.BAD_FREE -en COM.BSTR.ALLOC -en COM.BSTR.CONV -en CORS_MISCONFIGURATION -en CSRF -en CTOR_DTOR_LEAK -en CUDA.INACTIVE_THREAD_AT_COLLECTIVE_WARP -en CUDA.INVALID_MEMORY_ACCESS -en CUDA.SHARE_OBJECT_STREAM_ASSOCIATED -en DELETE_ARRAY -en DELETE_VOID -en DOM_XSS -en DYNAMIC_OBJECT_ATTRIBUTES -en EL_INJECTION -en END_OF_LIFE_RAILS -en END_OF_LIFE_RUBY -en GLOBAL_INIT_ORDER -en INCOMPATIBLE_CAST -en INEFFICIENT_RESERVE -en INTEGER_OVERFLOW -en JAVA_CODE_INJECTION -en JSP_SQL_INJECTION -en LDAP_INJECTION -en LOCK_EVASION -en MASS_ASSIGNMENT -en MISMATCHED_ITERATOR -en MISSING_COPY_OR_ASSIGN -en MISSING_RETURN -en MULTIPLE_INIT_SMART_PTRS -en NEGATIVE_RETURNS -en NO_EFFECT -en OGNL_INJECTION -en OPEN_REDIRECT -en OS_CMD_INJECTION -en OVERLAPPING_COPY -en OVERRUN -en PATH_MANIPULATION -en RAILS_DEFAULT_ROUTES -en RAILS_DEVISE_CONFIG -en READLINK -en REGEX_INJECTION -en REGEX_MISSING_ANCHOR -en RESOURCE_LEAK -en RETURN_LOCAL -en REVERSE_NEGATIVE -en RUBY_VULNERABLE_LIBRARY -en SCRIPT_CODE_INJECTION -en SENSITIVE_DATA_LEAK -en SESSION_MANIPULATION -en SIGMA.access_control_disabled -en SIGMA.admin_dashboard_publicly_accessible -en SIGMA.allow_all_authz_policy -en SIGMA.anonymous_access_enabled -en SIGMA.api_exposes_refresh_token -en SIGMA.automounting_service_account_token -en SIGMA.azure_ad_authentication_disabled -en SIGMA.azure_ad_managed_identities_disabled -en SIGMA.basic_auth_enabled -en SIGMA.certificate_verification_disabled -en SIGMA.cloud_gateway_publicly_accessible -en SIGMA.cloud_resource_assigned_public_ip -en SIGMA.cloud_resource_publicly_accessible -en SIGMA.cloud_service_authz_disabled -en SIGMA.cloud_storage_publicly_accessible -en SIGMA.code_injection -en SIGMA.container_requesting_net_raw -en SIGMA.container_requesting_sys_admin -en SIGMA.container_running_as_root -en SIGMA.container_sharing_host_network_namespace -en SIGMA.container_storing_secret_in_environment_variable -en SIGMA.cors_with_credentials_all_origin -en SIGMA.cors_with_credentials_null_origin -en SIGMA.csrf -en SIGMA.custom_cryptography -en SIGMA.default_allow_all_authz_policy -en SIGMA.digest_auth_enabled -en SIGMA.disk_encryption_disabled -en SIGMA.drop_invalid_header_disabled -en SIGMA.dynamically_loading_extensions_enabled -en SIGMA.el_injection -en SIGMA.empty_encryption_key -en SIGMA.empty_password -en SIGMA.empty_signing_key -en SIGMA.file_upload_misconfiguration_of_fields -en SIGMA.file_upload_misconfiguration_of_filesize -en SIGMA.file_upload_misconfiguration_of_storage -en SIGMA.file_upload_misconfiguration_of_temp_files -en SIGMA.hardcoded_secret -en SIGMA.http_verb_tampering_method_inclusion -en SIGMA.http_verb_tampering_method_omission -en SIGMA.insecure_network_bind -en SIGMA.insufficient_symmetric_key_size -en SIGMA.jwt_algorithm_none -en SIGMA.jwt_ignored_expiration_time -en SIGMA.jwt_untrusted_decode -en SIGMA.ldap_injection -en SIGMA.least_privilege_violation -en SIGMA.microservice_authn_disabled -en SIGMA.missing_high_availability_support -en SIGMA.missing_load_balancer -en SIGMA.missing_mtls -en SIGMA.missing_tls -en SIGMA.no_rate_limiting -en SIGMA.os_cmd_injection -en SIGMA.outdated_target_sdk_version -en SIGMA.outdated_version_used -en SIGMA.path_manipulation -en SIGMA.plaintext_storage_sensitive_data -en SIGMA.public_github_repository -en SIGMA.remote_access_via_guest_account -en SIGMA.script_code_injection -en SIGMA.sqli -en SIGMA.tiller_service_exposed -en SIGMA.unencrypted_sensitive_data -en SIGMA.unprotected_admin_operation -en SIGMA.unprotected_master_key -en SIGMA.unrestricted_egress -en SIGMA.unrestricted_ingress -en SIGMA.unsafe_deserialization -en SIGMA.unsafe_file_inclusion -en SIGMA.unsafe_innerhtml_manipulation -en SIGMA.unsafe_min_sdk_version -en SIGMA.unused_security_control -en SIGMA.vendor_provided_encryption_key -en SIGMA.vulnerable_software -en SIGMA.weak_xss_protection -en SIGMA.xpath_injection -en SIGMA.xss -en SINGLETON_RACE -en SIZECHECK -en SIZEOF_MISMATCH -en SQLI -en STRING_NULL -en STRING_OVERFLOW -en STRING_SIZE -en TAINT_ASSERT -en TEMPLATE_INJECTION -en UNENCRYPTED_SENSITIVE_DATA -en UNINIT -en UNLOCKED_ACCESS -en UNSAFE_BASIC_AUTH -en UNSAFE_DESERIALIZATION -en UNSAFE_REFLECTION -en UNSAFE_SESSION_SETTING -en USE_AFTER_FREE -en USE_AFTER_MOVE -en VIRTUAL_DTOR -en VOLATILE_ATOMICITY -en WEAK_GUARD -en WEAK_PASSWORD_HASH -en WRAPPER_ESCAPE -en WRITE_CONST_FIELD -en XSS -en Y2K38_SAFETY -en HARDCODED_CREDENTIALS --spotbugs-max-mem=4096"
      runAfter:
        - coverity-availability-check
      taskRef:
        params:
        - name: name
          value: sast-coverity-check
        - name: bundle
          value: quay.io/kdudka/sast-coverity-check:latest
        - name: kind
          value: task
        resolver: bundles
      when:
        - input: $(params.skip-checks)
          operator: in
          values: ["false"]
        - input: $(tasks.coverity-availability-check.results.STATUS)
          operator: in
          values: ["success"]
      workspaces:
      - name: source
        workspace: workspace
    - name: coverity-availability-check
      when:
        - input: $(params.skip-checks)
          operator: in
          values: ["false"]
      runAfter:
        #- clone-repository
        - build-container
      taskRef:
        params:
        - name: name
          value: coverity-availability-check
        - name: bundle
          value: quay.io/kdudka/coverity-availability-check:latest
        - name: kind
          value: task
        resolver: bundles
    - name: build-source-image
      params:
      - name: BINARY_IMAGE
        value: $(params.output-image)
      runAfter:
      - build-container
      taskRef:
        params:
        - name: name
          value: source-build
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-source-build:0.1@sha256:1cb3423593145e899b784000f6ae90e121763ce98c26f6fc049f5dee2310f805
        - name: kind
          value: task
        resolver: bundles
      when:
      - input: $(tasks.init.results.build)
        operator: in
        values:
        - "true"
      - input: $(params.build-source-image)
        operator: in
        values:
        - "true"
      workspaces:
      - name: workspace
        workspace: workspace
    - name: deprecated-base-image-check
      params:
      - name: IMAGE_URL
        value: $(tasks.build-container.results.IMAGE_URL)
      - name: IMAGE_DIGEST
        value: $(tasks.build-container.results.IMAGE_DIGEST)
      runAfter:
      - build-container
      taskRef:
        params:
        - name: name
          value: deprecated-image-check
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-deprecated-image-check:0.4@sha256:4ec00cf88c55a64eebaac0fe661cdb8dc8d3586d3a288f54400fbf2b5f06b408
        - name: kind
          value: task
        resolver: bundles
      when:
      - input: $(params.skip-checks)
        operator: in
        values:
        - "false"
    - name: clair-scan
      params:
      - name: image-digest
        value: $(tasks.build-container.results.IMAGE_DIGEST)
      - name: image-url
        value: $(tasks.build-container.results.IMAGE_URL)
      runAfter:
      - build-container
      taskRef:
        params:
        - name: name
          value: clair-scan
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-clair-scan:0.1@sha256:3ac359dfc034948d59b9e8d507a8cf505a19b205c543e4c861a332c6f82a0307
        - name: kind
          value: task
        resolver: bundles
      when:
      - input: $(params.skip-checks)
        operator: in
        values:
        - "false"
    - name: ecosystem-cert-preflight-checks
      params:
      - name: image-url
        value: $(tasks.build-container.results.IMAGE_URL)
      runAfter:
      - build-container
      taskRef:
        params:
        - name: name
          value: ecosystem-cert-preflight-checks
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-ecosystem-cert-preflight-checks:0.1@sha256:a4dc853e50a31272d45aef8e8bdc7dac0f0f92212fc7bf8bab67ba5917c03405
        - name: kind
          value: task
        resolver: bundles
      when:
      - input: $(params.skip-checks)
        operator: in
        values:
        - "false"
    - name: sast-shellcheck
      runAfter:
        - build-container
      when:
        - input: $(params.skip-checks)
          operator: in
          values:
            - "false"
      params:
      - name: image-digest
        value: $(tasks.build-container.results.IMAGE_DIGEST)
      - name: image-url
        value: $(tasks.build-container.results.IMAGE_URL)
      workspaces:
        - name: workspace
          workspace: workspace
      taskSpec:
        description: Scans source code for security vulnerabilities using ShellCheck, a Static Application Security Testing (SAST) tool.
        params:
          - description: Image URL.
            name: image-url
            type: string
          - description: Image digest to report findings for.
            name: image-digest
            type: string
        results:
          - description: Tekton task test output.
            name: TEST_OUTPUT
        steps:
          - image: quay.io/fedora/fedora:41
            name: sast-shellcheck
            workingDir: $(workspaces.workspace.path)
            script: |
              #!/usr/bin/env bash
              set -exuo pipefail

              dnf install -y csdiff shellcheck

              ./source/.ci/run-shellcheck.sh * > shellcheck-results.json
              csgrep --mode=evtstat shellcheck-results.json
              csgrep --mode=sarif shellcheck-results.json > $(workspaces.workspace.path)/hacbs/$(context.task.name)/shellcheck-results.sarif
          - name: upload
            image: quay.io/konflux-ci/oras:latest@sha256:99737f436051e6d3866eb8a8706463c35abf72c87f05090ff42ff642f6729661
            workingDir: $(workspaces.workspace.path)/hacbs/$(context.task.name)
            env:
              - name: IMAGE_URL
                value: $(params.image-url)
              - name: IMAGE_DIGEST
                value: $(params.image-digest)
            script: |
              #!/usr/bin/env bash
          
              UPLOAD_FILE=shellcheck-results.sarif
              MEDIA_TYPE=application/sarif+json

              if [ -z "${IMAGE_URL}" ] || [ -z "${IMAGE_DIGEST}"  ]; then
                echo 'No image-url or image-digest param provided. Skipping upload.'
                exit 0;
              fi

              if [ ! -f "${UPLOAD_FILE}" ]; then
                echo "No ${UPLOAD_FILE} exists. Skipping upload."
                exit 0;
              fi
          
              echo "Selecting auth"
              select-oci-auth $IMAGE_URL > $HOME/auth.json
              echo "Attaching to ${IMAGE_URL} via the OCI 1.1 Referrers API"
              oras attach --no-tty --registry-config "$HOME/auth.json" --distribution-spec v1.1-referrers-api --artifact-type "${MEDIA_TYPE}" "${IMAGE_URL}" "${UPLOAD_FILE}:${MEDIA_TYPE}"
              echo "Attaching to ${IMAGE_URL} via the OCI 1.1 Referrers Tag"
              oras attach --no-tty --registry-config "$HOME/auth.json" --distribution-spec v1.1-referrers-tag --artifact-type "${MEDIA_TYPE}" "${IMAGE_URL}" "${UPLOAD_FILE}:${MEDIA_TYPE}"
        workspaces:
          - name: workspace
    - name: sast-snyk-check
      params:
      - name: image-digest
        value: $(tasks.build-container.results.IMAGE_DIGEST)
      - name: image-url
        value: $(tasks.build-container.results.IMAGE_URL)
      runAfter:
      - build-container
      taskRef:
        params:
        - name: name
          value: sast-snyk-check
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-sast-snyk-check:0.1@sha256:f15181d70187fe31489d474d790dfb09f8faedd93b88a36cb467a2c4c79159e0
        - name: kind
          value: task
        resolver: bundles
      when:
      - input: $(params.skip-checks)
        operator: in
        values:
        - "false"
      workspaces:
      - name: workspace
        workspace: workspace
    - name: clamav-scan
      params:
      - name: image-digest
        value: $(tasks.build-container.results.IMAGE_DIGEST)
      - name: image-url
        value: $(tasks.build-container.results.IMAGE_URL)
      runAfter:
      - build-container
      taskRef:
        params:
        - name: name
          value: clamav-scan
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-clamav-scan:0.1@sha256:4cb5750b01759a4f3d02bb8c6869e80dcde7bd4c7f5c0a68dd18e57ea2ac676f
        - name: kind
          value: task
        resolver: bundles
      when:
      - input: $(params.skip-checks)
        operator: in
        values:
        - "false"
    - name: sbom-json-check
      params:
      - name: IMAGE_URL
        value: $(tasks.build-container.results.IMAGE_URL)
      - name: IMAGE_DIGEST
        value: $(tasks.build-container.results.IMAGE_DIGEST)
      runAfter:
      - build-container
      taskRef:
        params:
        - name: name
          value: sbom-json-check
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-sbom-json-check:0.1@sha256:80a4d5df9d56b93a98fdca5d5fa6d7ecdb9731cdffd1c16bf51ee11e49984140
        - name: kind
          value: task
        resolver: bundles
      when:
      - input: $(params.skip-checks)
        operator: in
        values:
        - "false"
    - name: apply-tags
      params:
      - name: IMAGE
        value: $(tasks.build-container.results.IMAGE_URL)
      runAfter:
      - build-container
      taskRef:
        params:
        - name: name
          value: apply-tags
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-apply-tags:0.1@sha256:8a8c1342bfa0b263361cbbc28036750ebc3d7c2460230b14d641170b812dddcc
        - name: kind
          value: task
        resolver: bundles
    - name: push-dockerfile
      params:
      - name: IMAGE
        value: $(tasks.build-container.results.IMAGE_URL)
      - name: IMAGE_DIGEST
        value: $(tasks.build-container.results.IMAGE_DIGEST)
      - name: DOCKERFILE
